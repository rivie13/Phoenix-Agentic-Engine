name: Upstream Sync

on:
  workflow_dispatch:
    inputs:
      upstream_owner:
        description: "Upstream repository owner"
        required: true
        default: "godotengine"
      upstream_branch:
        description: "Upstream branch to propose"
        required: true
        default: "master"
      base_branch:
        description: "Target branch in this repository"
        required: true
        default: "phoenix-main"
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday

permissions:
  contents: read
  pull-requests: write

jobs:
  open-upstream-pr:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_OWNER: ${{ inputs.upstream_owner || 'godotengine' }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'master' }}
      BASE_BRANCH: ${{ inputs.base_branch || 'phoenix-main' }}
    steps:
      - name: Create or reuse upstream sync PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const upstreamOwner = process.env.UPSTREAM_OWNER;
            const upstreamBranch = process.env.UPSTREAM_BRANCH;
            const baseBranch = process.env.BASE_BRANCH;
            const headRef = `${upstreamOwner}:${upstreamBranch}`;
            const basehead = `${baseBranch}...${headRef}`;

            core.info(`Checking for changes: ${headRef} -> ${owner}:${baseBranch}`);

            let comparison;
            try {
              comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead,
              });
            } catch (error) {
              core.setFailed(`Unable to compare ${basehead}: ${error.message}`);
              return;
            }

            if (comparison.data.ahead_by === 0) {
              core.notice(`No upstream changes available for ${headRef} into ${baseBranch}.`);
              return;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base: baseBranch,
              head: headRef,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              core.notice(`PR already open: #${existing.data[0].number}`);
              return;
            }

            const title = `Upstream sync: ${upstreamOwner}/${upstreamBranch} -> ${baseBranch}`;
            const body = [
              "Automated upstream sync PR.",
              "",
              `- Upstream: ${upstreamOwner}/${upstreamBranch}`,
              `- Target: ${owner}/${baseBranch}`,
              "",
              "Created by `.github/workflows/upstream-sync.yml`."
            ].join("\n");

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: headRef,
              base: baseBranch,
              body,
              maintainer_can_modify: true,
            });

            core.notice(`Created PR #${created.data.number}: ${created.data.html_url}`);
