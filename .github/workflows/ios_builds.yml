name: 🍏 iOS Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    tests=no
    debug_symbols=no

jobs:
  ios-template:
    # From https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
    runs-on: macos-latest
    name: Template (target=template_release)
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # From https://github.com/actions/runner-images/blob/main/images/macos
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Restore Phoenix build cache
        uses: ./.github/actions/phoenix-cache-restore
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/phoenix-deps

      - name: Compilation (arm64)
        uses: ./.github/actions/phoenix-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }}
          platform: ios
          target: template_release

      - name: Save Phoenix build cache
        uses: ./.github/actions/phoenix-cache-save
        continue-on-error: true

      - name: Guard artifact payload
        run: |
          if ! find ./bin -maxdepth 2 -type f -name '*ios*' | grep -q .; then
            echo "No iOS artifacts found under ./bin" >&2
            find ./bin -maxdepth 3 -type f | sort || true
            exit 1
          fi

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
