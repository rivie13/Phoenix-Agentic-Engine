name: Build Phoenix Agentic Engine

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Build Editor
        run: scons platform=windows target=editor module_ultimate_ai_enabled=yes

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-agentic-engine-windows
          path: bin/godot.windows.editor.x86_64.exe
