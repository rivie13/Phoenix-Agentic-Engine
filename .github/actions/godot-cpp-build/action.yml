name: "Legacy alias: phoenix-cpp-build"
description: Backward-compatible alias for ./.github/actions/phoenix-cpp-build.

inputs:
  bin:
    description: Path to the Phoenix editor binary.
    required: true
  scons-flags:
    description: Additional SCons flags.
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
  godot-cpp-branch:
    description: The C++ bindings branch.
    default: master

runs:
  using: composite
  steps:
    - name: Delegate to phoenix-cpp-build
      uses: ./.github/actions/phoenix-cpp-build
      with:
        bin: ${{ inputs.bin }}
        scons-flags: ${{ inputs.scons-flags }}
        scons-cache: ${{ inputs.scons-cache }}
        godot-cpp-branch: ${{ inputs.godot-cpp-branch }}
