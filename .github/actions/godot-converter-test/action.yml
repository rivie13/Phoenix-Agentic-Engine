name: "Legacy alias: phoenix-converter-test"
description: Backward-compatible alias for ./.github/actions/phoenix-converter-test.

inputs:
  bin:
    description: The path to the Phoenix editor executable
    required: true

runs:
  using: composite
  steps:
    - name: Delegate to phoenix-converter-test
      uses: ./.github/actions/phoenix-converter-test
      with:
        bin: ${{ inputs.bin }}
