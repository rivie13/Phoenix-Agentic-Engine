name: "Legacy alias: phoenix-deps"
description: Backward-compatible alias for ./.github/actions/phoenix-deps.

inputs:
  python-version:
    description: The Python version to use.
    default: 3.x
  python-arch:
    description: The Python architecture.
    default: x64
  scons-version:
    description: The SCons version to use.
    default: 4.10.1

runs:
  using: composite
  steps:
    - name: Delegate to phoenix-deps
      uses: ./.github/actions/phoenix-deps
      with:
        python-version: ${{ inputs.python-version }}
        python-arch: ${{ inputs.python-arch }}
        scons-version: ${{ inputs.scons-version }}
