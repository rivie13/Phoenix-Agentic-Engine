name: "Legacy alias: phoenix-cache-save"
description: Backward-compatible alias for ./.github/actions/phoenix-cache-save.
inputs:
  cache-name:
    description: The cache base name (job name by default).
    default: ${{ github.job }}
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/

runs:
  using: composite
  steps:
    - name: Delegate to phoenix-cache-save
      uses: ./.github/actions/phoenix-cache-save
      with:
        cache-name: ${{ inputs.cache-name }}
        scons-cache: ${{ inputs.scons-cache }}
