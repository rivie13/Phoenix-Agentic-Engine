name: Build GDExtension C++ bindings
description: Build GDExtension C++ bindings with the provided options.

inputs:
  bin:
    description: Path to the Phoenix editor binary.
    required: true
  scons-flags:
    description: Additional SCons flags.
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
  godot-cpp-branch:
    description: The C++ bindings branch.
    default: master

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: |
        api_dir="${RUNNER_TEMP:-/tmp}/godotcpp_api"
        mkdir -p "$api_dir"

        bin_path="${{ inputs.bin }}"
        case "$bin_path" in
          /*)
            godot_bin="$bin_path"
            ;;
          ./*)
            godot_bin="${GITHUB_WORKSPACE}/${bin_path#./}"
            ;;
          *)
            godot_bin="${GITHUB_WORKSPACE}/$bin_path"
            ;;
        esac

        if [ ! -f "$godot_bin" ]; then
          echo "::error::Phoenix editor binary not found: $godot_bin (input: $bin_path)" >&2
          ls -la "${GITHUB_WORKSPACE}/bin" || true
          exit 1
        fi
        chmod +x "$godot_bin" || true

        (
          cd "$api_dir"
          "$godot_bin" --headless --dump-gdextension-interface-json --dump-gdextension-interface --dump-extension-api
        )

        cp -f "$api_dir/extension_api.json" "${{ github.workspace }}/extension_api.json"
        cp -f "$api_dir/gdextension_interface.json" "${{ github.workspace }}/gdextension_interface.json"
        if [ -f "$api_dir/gdextension_interface.h" ]; then
          cp -f "$api_dir/gdextension_interface.h" "${{ github.workspace }}/gdextension_interface.h"
        fi

    - name: Normalize extension API json
      shell: sh
      run: |
        python_bin="$(command -v python3 || command -v python || true)"
        if [ -z "$python_bin" ]; then
          echo "::error::Python is required to normalize extension_api.json" >&2
          exit 1
        fi

        "$python_bin" - <<'PY'
        import json
        from pathlib import Path

        api_path = Path("${{ github.workspace }}/extension_api.json")

        def normalize_empty_arguments(node):
          if isinstance(node, dict):
            if "arguments" in node and isinstance(node["arguments"], list) and len(node["arguments"]) == 0:
              node.pop("arguments")
            for value in node.values():
              normalize_empty_arguments(value)
          elif isinstance(node, list):
            for item in node:
              normalize_empty_arguments(item)

        with api_path.open("r", encoding="utf-8") as f:
          api_data = json.load(f)

        normalize_empty_arguments(api_data)

        with api_path.open("w", encoding="utf-8") as f:
          json.dump(api_data, f, ensure_ascii=False)
        PY

    - name: SCons Build
      shell: sh
      run: scons --directory=./godot-cpp/test "gdextension_dir=${{ github.workspace }}" "custom_tools=${{ github.workspace }}/.github/godotcpp_tools" use_response_file=yes ${{ inputs.scons-flags }}
