name: "Legacy alias: phoenix-build"
description: Backward-compatible alias for ./.github/actions/phoenix-build.

inputs:
  target:
    description: Build target (editor, template_release, template_debug).
    default: editor
  platform:
    description: Target platform.
  scons-flags:
    description: Additional SCons flags.
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/

runs:
  using: composite
  steps:
    - name: Delegate to phoenix-build
      uses: ./.github/actions/phoenix-build
      with:
        target: ${{ inputs.target }}
        platform: ${{ inputs.platform }}
        scons-flags: ${{ inputs.scons-flags }}
        scons-cache: ${{ inputs.scons-cache }}
