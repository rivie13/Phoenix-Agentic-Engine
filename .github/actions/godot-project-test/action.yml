name: "Legacy alias: phoenix-project-test"
description: Backward-compatible alias for ./.github/actions/phoenix-project-test.

inputs:
  bin:
    description: The path to the Phoenix editor executable
    required: true
  extra-args:
    description: Optional extra CLI args for editor/test runs
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Delegate to phoenix-project-test
      uses: ./.github/actions/phoenix-project-test
      with:
        bin: ${{ inputs.bin }}
        extra-args: ${{ inputs.extra-args }}
